# Lint and scan the Terraform, verify the actions lockfile, and audit the
# workflows with zizmor.

name: alerts-scheduler-build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  terraform-lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4.0.0
      with:
        terraform_version: 1.14.8
        terraform_wrapper: false
    - name: Terraform format check
      run: terraform fmt -check -recursive -diff
    - name: Terraform validate
      run: |
        for dir in . s3-tf-state; do
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
        done

  trivy-scan:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Run Trivy IaC scan
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: 'config'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
        version: 'v0.69.3'
        trivyignores: '.trivyignore'

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: gh extension install github/gh-actions-lock --pin v0.4.1
    - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: zizmorcore/zizmor-action@v0.8.1
      with:
        version: 1.32.0
        advanced-security: false
        annotations: true
