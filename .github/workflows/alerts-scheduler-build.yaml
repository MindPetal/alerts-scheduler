# Lint and scan the Terraform, verify the actions lockfile, and audit the
# workflows with zizmor.

name: alerts-scheduler-build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  alerts-scheduler-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: 1.14.8
        terraform_wrapper: false
    - name: Terraform format check
      run: terraform fmt -check -recursive -diff
    - name: Terraform validate
      run: |
        for dir in . s3-tf-state; do
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
        done
    - name: Install Trivy
      # Downloaded directly and checked against a known checksum
      env:
        TRIVY_VERSION: 0.69.3
        TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
        tar -xzf trivy.tar.gz trivy
        rm trivy.tar.gz
    - name: Run Trivy IaC scan
      run: >-
        "$RUNNER_TEMP/trivy" config
        --exit-code 1
        --severity CRITICAL,HIGH
        --ignorefile .trivyignore
        --skip-dirs .terraform,s3-tf-state/.terraform
        --skip-version-check
        .
    - name: Summary
      run: echo "### Summary :rocket:" >> $GITHUB_STEP_SUMMARY

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: gh extension install github/gh-actions-lock --pin v0.4.1
    - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: zizmorcore/zizmor-action@v0.8.1
      with:
        version: 1.32.0
        advanced-security: false
        annotations: true
